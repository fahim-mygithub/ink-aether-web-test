<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Ink &amp; Aether</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The relay URL for multiplayer (config value relayUrl in Scripts/pages/pages.config.json; empty until Docs/NET_RELAY.md names one) -->
<meta name="ink-relay-url" content="wss://ink-and-aether-relay.workout-ai-worker.workers.dev/ws">
<style>
html,body{margin:0;height:100%;background:#111;color:#bbb;font:14px system-ui,sans-serif}
/* The bar above the game: the name on the left, the Fullscreen button on the right (dark, cream serif, brass outline) */
#bar{display:flex;align-items:center;gap:12px;box-sizing:border-box;width:1280px;max-width:100%;margin:0 auto;padding:6px 4px;
  font-family:Georgia,"Times New Roman",serif;color:#efe6d2}
#bar .name{font-size:18px;letter-spacing:.04em;margin-right:auto}
#bar .hint{font-size:12px;color:#a99f8a;font-style:italic}
/* u1-web-page-note-o: the note next to the button, and the button is the most visible thing in the bar */
#bar .rec{font-size:15px;color:#d9b77a;font-style:italic}
#fs{font:inherit;font-size:16px;color:#efe6d2;background:transparent;border:2px solid #b08d57;border-radius:3px;padding:5px 16px;cursor:pointer}
#fs:hover{background:#b08d5733}
#fs:focus-visible{outline:2px solid #d9b77a;outline-offset:2px}
#fs kbd{font:inherit;font-size:12px;color:#d9b77a}
#wrap{position:relative;width:1280px;max-width:100%;margin:0 auto}
/* The card over the frame before the first click: shown once, the choice is remembered (localStorage ink.fs.choice) */
#card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;box-sizing:border-box;max-width:90%;padding:18px 24px;
  text-align:center;background:#16120cf0;border:1px solid #b08d57;border-radius:4px;font-family:Georgia,"Times New Roman",serif;color:#efe6d2}
#card[hidden]{display:none}
#card p{margin:0 0 14px;font-size:17px}
#card #cardfs{font:inherit;font-size:16px;color:#efe6d2;background:#b08d5733;border:2px solid #b08d57;border-radius:3px;padding:6px 18px;cursor:pointer}
#card #cardfs:hover{background:#b08d5755}
#card a{display:block;margin-top:10px;font-size:13px;color:#a99f8a}
#frame{display:block;margin:0 auto;width:1280px;height:720px;max-width:100%;border:0;background:#000}
/* In full screen the frame fills the screen; the game's canvas follows its window (the engine's page sizes it 100% x 100%,
   and the engine renders at that size, so nothing stretches) */
#frame:fullscreen{width:100vw;height:100vh;max-width:none;background:#000}
#frame:-webkit-full-screen{width:100vw;height:100vh;max-width:none;background:#000}
</style></head><body>
<div id="bar">
  <span class="name">Ink &amp; Aether</span>
  <span class="hint">Esc leaves full screen</span>
  <span class="rec">Full screen is highly recommended</span>
  <button id="fs" type="button" aria-label="Fullscreen (shortcut F)" title="Fullscreen (F)">Fullscreen <kbd>F</kbd></button>
</div>
<div id="wrap"><div id="card" hidden role="dialog" aria-label="Full screen is highly recommended">
  <p>Full screen is highly recommended</p>
  <button id="cardfs" type="button">Play full screen</button>
  <a id="cardwin" href="#">Play in the window</a>
</div></div>
<script>
// Full screen on the game frame. Browsers allow it only from a user gesture on this page, so it is called from the click (or
// key) handler itself. Keys reach this page only while it, not the game frame, has focus, so no game key is taken.
(() => {
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const toggle = () => {
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const f = document.getElementById('frame');
    if (!f) return;
    const req = f.requestFullscreen || f.webkitRequestFullscreen;
    if (!req) return;
    const p = req.call(f);
    if (p && p.then) p.then(() => f.focus(), (e) => console.warn('fullscreen refused', e)); else f.focus();
  };
  document.getElementById('fs').addEventListener('click', toggle);
  // The card: once, before the first click on the game; both choices are clicks (a user gesture, so full screen is allowed)
  const KEY = 'ink.fs.choice';
  let chosen = null;
  try { chosen = localStorage.getItem(KEY); } catch (e) { /* private window: show the card */ }
  const card = document.getElementById('card');
  const choose = (c) => {
    try { localStorage.setItem(KEY, c); } catch (e) { /* not remembered */ }
    card.hidden = true;
    if (c === 'full') { if (!fsEl()) toggle(); } else { const f = document.getElementById('frame'); if (f) f.focus(); }
  };
  if (!chosen) card.hidden = false;
  document.getElementById('cardfs').addEventListener('click', () => choose('full'));
  document.getElementById('cardwin').addEventListener('click', (e) => { e.preventDefault(); choose('window'); });
  // Right click never opens the browser menu on this page (the game page blocks it inside the frame itself, pages_prepare.ps1)
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if ((e.key === 'f' || e.key === 'F')) { e.preventDefault(); toggle(); }
  });
  const sync = () => {
    const on = !!fsEl();
    const b = document.getElementById('fs');
    b.firstChild.nodeValue = on ? 'Exit full screen ' : 'Fullscreen ';
    b.setAttribute('aria-label', on ? 'Exit full screen (Esc)' : 'Fullscreen (shortcut F)');
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
})();
</script>
<script>
// Pages cannot send COOP/COEP; coi-sw.js adds them, so the page reloads once under it (a top page that is not cross-origin
// isolated cannot host an isolated iframe). itch.io sends the headers itself, so none of this exists there.
(async () => {
  if (!window.crossOriginIsolated && 'serviceWorker' in navigator && !sessionStorage.getItem('ink.coi.reload')) {
    try {
      const reg = await navigator.serviceWorker.register('coi-sw.js');
      await navigator.serviceWorker.ready;
      sessionStorage.setItem('ink.coi.reload', '1');
      location.reload();
      return;
    } catch (e) { console.error('coi-sw register failed', e); }
  }
  const f = document.createElement('iframe');
  f.id = 'frame';
  // itch.io's embed (verified against a live html-classic.itch.zone page, see Docs/PAGES_TEST.md): see the allow list there
  f.setAttribute('allow', 'autoplay; fullscreen *; geolocation; microphone; camera; midi; monetization; xr-spatial-tracking; gamepad; gyroscope; accelerometer; xr; cross-origin-isolated; web-share');
  f.setAttribute('allowfullscreen', 'true');
  f.setAttribute('scrolling', 'no');
  f.setAttribute('title', 'Ink & Aether');
  f.src = 'play/index.html';
  f.addEventListener('contextmenu', (e) => e.preventDefault());
  document.getElementById('wrap').appendChild(f);
})();
</script></body></html>
