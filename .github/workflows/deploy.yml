name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.4.0
      # The .wasm is over git's 100 MB file limit: it is the release asset of tag "wasm" (Scripts/pages_deploy.ps1 uploads it)
      - name: Fetch the .wasm and check its sha1 against wasm-cache.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=site/play/InkAether/Binaries/Wasm
          mkdir -p "$dir"
          gh release download wasm --repo "$GITHUB_REPOSITORY" --pattern '*.wasm' --dir "$dir" --clobber
          want=$(jq -r '.[] | select(.url|endswith(".wasm")) | .sha1' site/play/wasm-cache.json)
          got=$(sha1sum "$dir"/*.wasm | cut -d' ' -f1)
          echo "wasm sha1 want=$want got=$got"
          test "$want" = "$got"
          ls -l "$dir"
      # Other files over git's 100 MB limit (added by pages_prepare.ps1): release assets of tag "wasm" too, sha1 checked against wasm-cache.json
      - name: Fetch the other large files and check their sha1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() {
            d="site/play/$(dirname "$1")"; mkdir -p "$d"
            gh release download wasm --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$1")" --dir "$d" --clobber
            want=$(jq -r --arg u "$1" '.[] | select(.url==$u) | .sha1' site/play/wasm-cache.json)
            got=$(sha1sum "site/play/$1" | cut -d' ' -f1)
            echo "$1 sha1 want=$want got=$got"; test "$want" = "$got"
          }
          fetch 'InkAether/Content/Paks/InkAether-Wasm.ucas'
      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
